name: 01 - Intro au Action

on:
  workflow_dispatch:

jobs:
  test_project:
    runs-on: ubuntu-latest
    steps:
      - name: View initial files
        run: ls -a -l
      - name: Get code of repo → Checkout !
        uses: actions/checkout@v6
      - name: View files after checkout
        run: ls -a -l
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install dependence
        run: npm ci
      - name: Lancement les tests
        run: npm run test:run